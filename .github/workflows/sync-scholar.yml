name: Sync Google Scholar Publications

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

concurrency:
  group: scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Scholar sync configuration
        id: scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_USER_ID: ${{ secrets.SCHOLAR_USER_ID }}
        run: |
          if [[ -n "$SERPAPI_KEY" && -n "$SCHOLAR_USER_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Scholar sync skipped: configure SERPAPI_KEY and SCHOLAR_USER_ID repository secrets."
          fi

      - name: Generate publications from Google Scholar
        if: steps.scholar.outputs.enabled == 'true'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_USER_ID: ${{ secrets.SCHOLAR_USER_ID }}
        run: npm run sync:scholar

      - name: Validate generated data
        if: steps.scholar.outputs.enabled == 'true'
        run: npm run validate:data

      - name: Commit updated publications
        if: steps.scholar.outputs.enabled == 'true'
        run: |
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "Google Scholar publications are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Google Scholar publications"
          git push
