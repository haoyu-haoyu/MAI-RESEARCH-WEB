        - img "Dr Hugh Logan-Ellis" [ref=e926]
        - generic [ref=e928]:
          - heading "Dr Hugh Logan-Ellis" [level=3] [ref=e929]
          - paragraph [ref=e930]: Clinical Lecturer, St Thomas' Hospital Campus
          - paragraph [ref=e931]: Physician (General Internal Medicine & Endocrinology) and scientist (clinical AI and latent health status measurement)
        - generic [ref=e932]: Hugh's research focuses on the "pragmatic extraction" of health measures from electronic health records (EHRs), addressing critical gaps in clinical decision support. Hugh's research coined the "early warning paradox," exploring how retrospective AI validation can undervalue life-saving tools, and the "polar bear problem," where models learn to mirror clinical suspicion rather than pure physiology. Hugh's current work aims to move AI from "predicting fate" to "measuring state" by developing "digital twins"— physiological simulators that leverage foundation models and clinical embeddings to provide transparent, real-time insights into a patient's underlying physiological reserve.
