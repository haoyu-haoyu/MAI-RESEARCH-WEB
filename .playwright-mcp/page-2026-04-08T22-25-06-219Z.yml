        - generic [ref=e976]:
          - heading "Dr Zhangshu Joshua Jiang" [level=3] [ref=e977]
          - paragraph [ref=e978]: PhD Student (DRIVE-Health CDT)
          - paragraph [ref=e979]: Neurosciences Fellow, Cleveland Clinic London
        - generic [ref=e980]: Joshua combines clinical neuroscience practice with research into trustworthy generative AI for healthcare. He is currently a Neurosciences Fellow at Cleveland Clinic London and a PhD student in Health Data Science at King's College London, where his research focuses on building AI systems that reason more like clinicians and less like black boxes. His current work includes conducting clinical neurology and neuro-rehabilitation at Cleveland Clinic London. He also develops multi-agent generative AI systems for clinical decision support as part of his doctoral research, and explores approaches to make AI reasoning transparent, interpretable, and aligned with real clinical workflows.
